<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary navbar-nav-scroll">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Booked</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                      <a class="nav-link" href="{% url 'user:login' %}">Login</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="{% url 'user:register' %}">Register</a>
                    </li>
                    <li class="nav-item">
                      <a class="nav-link" href="/">About</a>
                    </li>
                  </ul>
            </div>
        </div>
    </nav>

    <div id="headingDiv">
	   <h1>Registration</h1>
    </div>

    <div id="ManagerBtn"></div>
    <div id="CustomerBtn"></div>

    <div id="form"></div>
    
    <form name="register-form" class="row g-3" method="POST" action="{% url 'user:register' %}">
        {% csrf_token %}
        <div class="col-md-6">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" required autocomplete="on">
        </div>
        <div class="col-md-6">
            <label for="username" class="form-label">Username</label>
            <input type="username" class="form-control" id="username" name="username" required autocomplete="on">
        </div>
        <div class="col-md-6">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required autocomplete="on">
        </div>
        <div class="col-md-6">
            <label for="phone_number" class="form-label">Phone Number</label>
            <input type="number" class="form-control" id="phone_number" name="phone_number" required>
        </div>
        <div class="col-md-6">
            <label for="user_type" class="form-label">User Type</label>
            <select id="user_type" class="form-control" name="user_type" required>
                <option value="manager"> Manager </option>
                <option value="customer"> Customer </option>
            </select>
        </div>
        <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="col-md-6">
            <button type="submit" class="btn btn-outline-primary">Register</button>
        </div>

        <div class="col-md-6"> Already registered? <a href="{% url 'user:login' %}">Login</a> </div>

        <div id="validation-errors">
            <p> {{ validation }} </p>
        </div>
    </form>

    <script> const csrftoken = "{{ csrf_token }}"; </script>

    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'user/register.css' %}">
    <script src="{% static 'user/register.js' %}"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</body>
</html>
