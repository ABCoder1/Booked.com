<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Room</title>
</head>
<body>
    <div id="headingDiv">
	   <h1>Create a Room</h1>
    </div>

    <!-- <div id="ManagerBtn"></div>
    <div id="CustomerBtn"></div> -->

    <div id="room_form"></div>
    
    <form method="POST" action="{% url 'booking:add_room' %}">
        {% csrf_token %}

        <label for="name">Name : </label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="description">Description : </label>
        <input type="text" id="description" name="description" required>
        <br>
        <label for="location">Location : </label>
        <input type="text" id="location" name="location" required>
        <br>
        <input type="submit" value="create">

        {% if validation %}
        <div>
            <p> {{ validation }} </p>
        </div>
        {% endif %}

        {% load static %}
        <link rel="stylesheet" type="text/css" href="{% static 'booking/add_room.css' %}">
        <!-- <script src="{% static 'booking/add_room.js' %}"></script> -->
    </form>

</body>
</html>
